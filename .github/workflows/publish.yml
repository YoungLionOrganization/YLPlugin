name: publish-verified-release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful build-and-conformance run supplying release assets
        required: true
      tag:
        description: Version tag matching the artifact manifest
        required: true
        default: v0.1.2
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ylplugin-release-assets
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Verify provenance and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python tools/publish_release.py
