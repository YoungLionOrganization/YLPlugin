name: build-and-conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: YoungLionOrganization/YLSpec
          ref: 74ef1470105566b812c8a712ce56848f98c277cb
          path: _deps/YLSpec
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev libzstd-dev nlohmann-json3-dev qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3 zstd nlohmann-json qt
      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows zstd:x64-windows nlohmann-json:x64-windows
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/tools/openssl" >> $env:GITHUB_PATH
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DYLPLUGIN_YLSPEC_SOURCE=_deps/YLSpec -DYLPLUGIN_QT=ON
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DYLPLUGIN_YLSPEC_SOURCE=_deps/YLSpec -DYLPLUGIN_QT=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix openssl@3)"
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DYLPLUGIN_YLSPEC_SOURCE=_deps/YLSpec -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python -m pip install jsonschema
      - run: python tests/schema.py
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: YoungLionOrganization/YLSpec
          ref: 74ef1470105566b812c8a712ce56848f98c277cb
          path: _deps/YLSpec
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev libzstd-dev nlohmann-json3-dev qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DYLPLUGIN_YLSPEC_SOURCE=_deps/YLSpec -DYLPLUGIN_QT=ON -DYLPLUGIN_SANITIZE=ON -DYLSPEC_SANITIZE=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: YoungLionOrganization/YLSpec
          ref: 74ef1470105566b812c8a712ce56848f98c277cb
          path: _deps/YLSpec
      - run: sudo apt-get update && sudo apt-get install -y clang ninja-build libssl-dev libzstd-dev nlohmann-json3-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBUILD_TESTING=OFF -DYLPLUGIN_YLSPEC_SOURCE=_deps/YLSpec -DYLPLUGIN_FUZZ=ON -DYLPLUGIN_SANITIZE=ON -DYLSPEC_SANITIZE=ON
      - run: cmake --build build --target ylplugin_fuzz --parallel 4
      - run: mkdir -p build/corpus && cp tests/vectors/*.ylplugin build/corpus/ && ./build/ylplugin_fuzz -max_total_time=60 -max_len=65536 build/corpus
  package:
    needs: [desktop, sanitizers, fuzz]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/package_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: ylplugin-release-assets
          path: dist/*
          if-no-files-found: error
