name: publish-registry-libraries
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful language-libraries run for an already published matching GitHub Release
        required: true
      registry:
        type: choice
        options: [npm, pypi, maven]
        required: true
permissions: {contents: read, actions: read}
concurrency:
  group: registry-${{ inputs.registry }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', registry-url: 'https://registry.npmjs.org'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: registry-distributions
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: registry-input
      - name: Verify release, CI provenance, package names and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
          REGISTRY: ${{ inputs.registry }}
        run: python tools/registry.py "prepare-$REGISTRY"
      - name: Publish npm
        if: inputs.registry == 'npm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo '::error::NPM_TOKEN organization secret is unavailable'; exit 1; }
          npm publish "$REGISTRY_DIRECTORY/"*.tgz --access public --ignore-scripts
      - name: Publish PyPI
        if: inputs.registry == 'pypi'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          test -n "$TWINE_PASSWORD" || { echo '::error::PYPI_API_TOKEN organization secret is unavailable'; exit 1; }
          python -m pip install twine
          python -m twine check "$REGISTRY_DIRECTORY/"*.whl
          python -m twine upload --non-interactive "$REGISTRY_DIRECTORY/"*.whl
      - name: Sign and publish Maven Central
        if: inputs.registry == 'maven'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          test -n "$MAVEN_CENTRAL_USERNAME" && test -n "$MAVEN_CENTRAL_PASSWORD" && test -n "$MAVEN_GPG_PRIVATE_KEY" && test -n "$MAVEN_GPG_PASSPHRASE" || { echo '::error::Maven organization secrets are unavailable'; exit 1; }
          python tools/registry.py central
